[package]
name = "navigation"
description = "页面生命周期、导航协调器与流式解析协调（含 document.write 插入点）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# HTML 解析（ADR-0006 / R3：**钉 0.27**，与 T2.3 一致；markup5ever 0.12.1 随附）。
html5ever = "0.27"
# 节点树（`TreeSink` 落点，`Handle = NodeId`）。
# 必须带 `version`（否则 cargo deny 报 wildcard；与 workspace.package.version = 0.0.0 一致）。
web-dom = { path = "../web-dom", version = "0.0.0" }
# origin / NavigationEpoch（共享层，ADR-0017·D1）。
policy = { path = "../policy", version = "0.0.0" }
# ControlPlane / Realm / 弱句柄 / node_map（页面宿主）。
engine-v8 = { path = "../engine-v8", version = "0.0.0" }
# 事件注册表 / 分派（监听器槽用 WeakJsHandle）。
web-events = { path = "../web-events", version = "0.0.0" }
# 内联样式。
web-style = { path = "../web-style", version = "0.0.0" }
# 存储面（G4-S1：StorageService / Storage）。
storage = { path = "../storage", version = "0.0.0" }
# 运行循环 / 双时钟 / 有界推进。
scheduler = { path = "../scheduler", version = "0.0.0" }
# 网络最小面（OfflineBundle / complete 语义）。
network = { path = "../network", version = "0.0.0" }
# 布局门面（S12：几何真值 + 同步读 §2.5）。
layout-backend = { path = "../layout-backend", version = "0.0.0" }

[dev-dependencies]
# 测试期开启 `engine-v8` 的 `test-util`：暴露 `Realm::collect_garbage_for_testing`
# （供 `navigation::binding` 的弱引用路径测试）。默认构建**不**开启 ⇒ 不扩大稳定类型面。
engine-v8 = { path = "../engine-v8", version = "0.0.0", features = ["test-util"] }
