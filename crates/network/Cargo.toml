[package]
name = "network"
description = "网络语义层（Fetch/XHR/Cookie/缓存）与可插拔传输后端"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# 导航代次 `NavigationEpoch`（定义点落 policy —— ADR-0017·D1，避免 navigation↔network 依赖环）。
# 必须带 `version`（否则 cargo deny 报 wildcard；与 workspace.package.version = 0.0.0 一致）。
policy = { path = "../policy", version = "0.0.0" }
