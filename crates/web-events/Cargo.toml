[package]
name = "web-events"
description = "事件模型：捕获/冒泡、默认动作、监听器变更与可信模拟输入"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# C-2：监听器槽只用 **弱句柄** `engine_v8::WeakJsHandle`（不出现 JsHandle/HandleLease）。
# 必须带 `version`（否则 cargo deny 报 wildcard；与 workspace.package.version = 0.0.0 一致）。
engine-v8 = { path = "../engine-v8", version = "0.0.0" }
# 分派路径 / 监听器目标用 `NodeId`。
web-dom = { path = "../web-dom", version = "0.0.0" }
