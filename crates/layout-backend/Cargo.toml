[package]
name = "layout-backend"
description = "盒树、布局算法与几何/尺寸 API（首选 Blitz 集成，备选 Stylo+Taffy+Parley）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# 门面 trait 的类型面：`web_dom::{node::NodeId, tree::NodeTree}` + `web_style::SheetOrigin`（施工图 §1.2）。
# 必须带 `version`（否则 cargo deny 报 wildcard；与 workspace.package.version = 0.0.0 一致）。
# 样式/布局引擎依赖（stylo/taffy/parley/…，ADR-0021 精确锁版）在 **S6** 落地时按需引入（一事一 PR）。
web-dom = { path = "../web-dom", version = "0.0.0" }
web-style = { path = "../web-style", version = "0.0.0" }
