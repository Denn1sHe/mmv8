# 工具链固定入口。本地与远程（Linux x86_64 目标平台验证机）共用同一 channel。
#
# 说明：
# - **钉精确版本 `1.92.0`**（ADR-0022 决策 1）：消除「本地能编译、远程跑不了」的
#   lint 漂移（根因 = 版本漂移，非功能缺陷；G1·K-2 / G2·D1 两次单端红）。
#   远程安装 `rustup toolchain install 1.92.0` 属用户级安装（AGENTS.md 工具链策略已授权）。
# - CI 矩阵收敛（`["stable","1.92.0"]` → 与钉版一致）列为**待维护者批准**条（铁律 7，
#   `.github/workflows/**` 零改动），见 ADR-0022 决策 3。
# - `components` 必须包含 rustfmt 与 clippy：两者是合并门禁工具（AGENTS.md 自检命令）。
# - 远程曾因 rustup `minimal` profile 缺组件导致门禁不可用，故此处显式声明。
[toolchain]
channel = "1.92.0"
profile = "default"
components = ["rustfmt", "clippy"]
targets = []
